name: Pull Request Verification
permissions:
  contents: read

on:
  pull_request:

concurrency:
  group: pr-verify-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  workflow-quality:
    name: Workflow and Template Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Lint GitHub Actions workflows
        uses: reviewdog/action-actionlint@dbe5299849118fd6f099ba563d263d770955a64a # v1.73.2
        with:
          reporter: github-annotations
          fail_level: error

  repo-linter:
    name: Repo Linter
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: 'Run Repolinter'
        uses: newrelic/repolinter-action@3f4448f855c351e9695b24524a4111c7847b84cb # v1.7.0

  reuse-compliance:
    name: REUSE Compliance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  conventional-commits:
    name: Conventional Commits
    if: >-
      !(
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login == 'inditextechbot[bot]' &&
        (
          github.head_ref == 'automated/sync-from-main-to-develop' ||
          startsWith(github.head_ref, 'automated/sync-release-')
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate immutable recovery history
        id: recovery-history
        if: >-
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.head_ref == 'canary/recover-maven-0.2.10'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail

          trusted_nonconventional_commits=(
            9854222d35b4c625abf692a835db2e80dcfe4dd3
            407ff3e5a16e5b2f6ab3af33709e1e5075aba845
            e9d4ca311cb5880e7fadc875b6a4ff1602065ba1
            8e720937eee013d90b79ef71b41d963b5211e73e
            a5d05addb8e8cf096b5b8342e61f3cbd14a9c738
            75e7cc20b341524bf164e50ac11f456526443792
            92dc2078ae4007f79c27172cae86256e58354bd5
            1996b1170fa2ae973a787145244b04d0ed16d192
            72ab00b1de977e8b6c88d9084dd27ef388190ed0
            275963f1e65807928eecaca3ad74b981818474d8
          )
          conventional_pattern='^(feat|fix|docs|style|refactor|test|build|perf|ci|chore|revert|merge|wip)(\([^)]+\))?!?: .+$'
          while IFS=$'\t' read -r commit subject; do
            if [[ " ${trusted_nonconventional_commits[*]} " == *" $commit "* ]] \
              || [[ "$subject" =~ $conventional_pattern ]]; then
              continue
            fi
            echo "::error title=Unexpected non-conventional commit::$commit $subject"
            exit 1
          done < <(git log --format='%H%x09%s' "$BASE_SHA..HEAD")
          echo "skip_conventional=true" >> "$GITHUB_OUTPUT"

      - name: Validate conventional commits
        if: steps.recovery-history.outputs.skip_conventional != 'true'
        uses: webiny/action-conventional-commits@7f91b1595ca1951cdb671ddc9f07a49081ec5b69 # v1.4.2
