name: code-maven-java-build-snapshot
run-name: Build Java snapshot from ${{ github.event_name }}

on:
  workflow_dispatch:
  push:
    branches: [main, main-*, develop, develop-*]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, main-*, develop, develop-*]

permissions:
  contents: read

concurrency:
  group: code-maven-java-build-snapshot-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PROJECT_TYPE: ${{ vars.PROJECT_TYPE }}
  WORKING_DIRECTORY: ${{ vars.WORKING_DIRECTORY }}
  ASDF_BRANCH_VERSION: '0.18.0'

jobs:
  build-snapshot:
    name: Build Snapshot
    if: >-
      (
        vars.DEVELOPMENT_FLOW == 'trunk-based-development' &&
        (
          (github.event_name == 'workflow_dispatch' && (github.ref_name == 'main' || startsWith(github.ref_name, 'main-'))) ||
          (github.event_name == 'pull_request' && (github.event.pull_request.base.ref == 'main' || startsWith(github.event.pull_request.base.ref, 'main-'))) ||
          (github.event_name == 'push' && (github.ref_name == 'main' || startsWith(github.ref_name, 'main-')))
        )
      ) ||
      (
        vars.DEVELOPMENT_FLOW == 'git-flow' &&
        (
          (github.event_name == 'workflow_dispatch' && (github.ref_name == 'develop' || startsWith(github.ref_name, 'develop-'))) ||
          (github.event_name == 'pull_request' && (github.event.pull_request.base.ref == 'develop' || startsWith(github.event.pull_request.base.ref, 'develop-'))) ||
          (github.event_name == 'push' && (github.ref_name == 'develop' || startsWith(github.ref_name, 'develop-')))
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      publish_snapshot: ${{ steps.build.outputs.publish_snapshot }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up workflow Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25.0.2+10.0.LTS'
          cache: maven
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/**/pom.xml

      - name: Read governed tool versions
        id: tool-versions
        working-directory: ${{ env.WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail
          # Reject any .tool-versions line that is not a strict "<plugin> <version>" before asdf reads it.
          if grep -Evq '^[a-zA-Z0-9_-]+ [a-zA-Z0-9._+-]+$' .tool-versions; then
            echo "::error title=Invalid tool-versions::${WORKING_DIRECTORY}/.tool-versions is malformed."
            exit 1
          fi
          {
            echo "tool_versions<<EOF"
            cat .tool-versions
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up asdf-managed Java
        uses: asdf-vm/actions/install@1902764435ca0dd2f3388eea723a4f92a4eb8302 # v4.0.0
        with:
          tool_versions: ${{ steps.tool-versions.outputs.tool_versions }}
          asdf_version: ${{ env.ASDF_BRANCH_VERSION }}

      - name: Resolve build JDK from .tool-versions
        id: jdk
        working-directory: ${{ env.WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail
          # asdf installs the .tool-versions JDK but does not export it. Emit it as
          # a step output so ONLY the Maven build runs on the consumer JDK; every
          # other workflow step keeps the pinned Java 25 set up above.
          echo "java_home=$(asdf where java)" >> "$GITHUB_OUTPUT"

      - name: Verify snapshot candidate
        id: build
        working-directory: ${{ env.WORKING_DIRECTORY }}
        shell: bash
        env:
          JAVA_HOME: ${{ steps.jdk.outputs.java_home }}
        run: |
          set -euo pipefail

          # Snapshot deploy is opt-in per descriptor (`release.snapshot_publish`,
          # default off). Absent/false leaves the reactor verified but never
          # deployed — correct for products without a snapshot repository.
          descriptor="$GITHUB_WORKSPACE/.github/inditextech-ci-java.json"
          snapshot_optin="$(jq -r '.release.snapshot_publish // false' "$descriptor")"

          publish_snapshot=false
          if [[ "$snapshot_optin" == "true" && "$GITHUB_EVENT_NAME" == "push" ]]; then
            # Skip the redundant snapshot produced by the release's own commits.
            # Key on the release-bot committer identity (App `<slug>[bot]`), not
            # the commit subject, so it holds under both govern-inject and
            # delegated (where maven-release-plugin owns the commit wording).
            committer_email="$(git -C "$GITHUB_WORKSPACE" show -s --format=%ae HEAD)"
            if [[ "$committer_email" == *"[bot]@users.noreply.github.com" ]]; then
              echo "::notice title=Snapshot skipped::Release-bot commit does not need a snapshot."
            else
              publish_snapshot=true
            fi
          fi
          echo "publish_snapshot=$publish_snapshot" >> "$GITHUB_OUTPUT"

          # A snapshot candidate is always verified (the push/PR CI gate). The
          # published version is the POM's own `-SNAPSHOT`; the Central Portal
          # snapshot repository timestamps each deploy, so no version munging is
          # required (unlike Python's `.devN`).
          case "$PROJECT_TYPE" in
            single|monorepo)
              mvn -B --no-transfer-progress -f pom.xml clean verify
              ;;
            *)
              echo "::error title=Invalid project type::PROJECT_TYPE must be single or monorepo."
              exit 1
              ;;
          esac

  publish-snapshot:
    name: Publish snapshot to Maven Central
    needs: build-snapshot
    if: github.event_name == 'push' && needs.build-snapshot.outputs.publish_snapshot != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: maven-central
    permissions:
      contents: read
    env:
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      CI_GPG_SECRET_KEY: ${{ secrets.CI_GPG_SECRET_KEY }}
      CI_GPG_SECRET_KEY_PASSWORD: ${{ secrets.CI_GPG_SECRET_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up workflow Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25.0.2+10.0.LTS'
          cache: maven
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/**/pom.xml

      - name: Read governed tool versions
        id: tool-versions
        working-directory: ${{ env.WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail
          # Reject any .tool-versions line that is not a strict "<plugin> <version>" before asdf reads it.
          if grep -Evq '^[a-zA-Z0-9_-]+ [a-zA-Z0-9._+-]+$' .tool-versions; then
            echo "::error title=Invalid tool-versions::${WORKING_DIRECTORY}/.tool-versions is malformed."
            exit 1
          fi
          {
            echo "tool_versions<<EOF"
            cat .tool-versions
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up asdf-managed Java
        uses: asdf-vm/actions/install@1902764435ca0dd2f3388eea723a4f92a4eb8302 # v4.0.0
        with:
          tool_versions: ${{ steps.tool-versions.outputs.tool_versions }}
          asdf_version: ${{ env.ASDF_BRANCH_VERSION }}

      - name: Resolve build JDK from .tool-versions
        id: jdk
        working-directory: ${{ env.WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail
          # asdf installs the .tool-versions JDK but does not export it. Emit it as
          # a step output so ONLY the Maven build runs on the consumer JDK; every
          # other workflow step keeps the pinned Java 25 set up above.
          echo "java_home=$(asdf where java)" >> "$GITHUB_OUTPUT"

      - name: Resolve publishable modules
        id: modules
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PROJECT_TYPE" != "monorepo" ]]; then
            # A single reactor deploys as a whole; the composite rejects a
            # populated `packages` for a single project.
            echo "packages=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # artifact_id mirrors the adapter's _artifact_id(): descriptor package
          # names are raw; the reactor addresses each module by its slug, which is
          # also the flat module directory name. jacoco-report-aggregate is never
          # a descriptor package, so it is never deployed.
          artifact_id() {
            printf '%s' "$1" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//'
          }
          descriptor="$GITHUB_WORKSPACE/.github/inditextech-ci-java.json"
          packages=""
          while IFS= read -r package; do
            packages="${packages:+$packages,}$(artifact_id "$package")"
          done < <(jq -er '.release.packages[]' "$descriptor")
          if [[ -z "$packages" ]]; then
            echo "::error title=Invalid descriptor::No publishable modules resolved from .release.packages."
            exit 1
          fi
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

      - name: Deploy snapshot to Maven Central
        env:
          JAVA_HOME: ${{ steps.jdk.outputs.java_home }}
        uses: InditexTech/gh-actions/maven-central@7138f88b2fa8e90318bcb4bf5f9ce6c147b13d2f # v1.0.0
        with:
          working-directory: ${{ vars.WORKING_DIRECTORY }}
          project-type: ${{ vars.PROJECT_TYPE }}
          packages: ${{ steps.modules.outputs.packages }}
          auto-publish: 'false'
