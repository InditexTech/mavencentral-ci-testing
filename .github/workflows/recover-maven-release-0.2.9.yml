name: Recover Maven release 0.2.9

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  finalize:
    name: Finalize verified 0.2.9 publication
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Verify immutable recovery inputs
        shell: bash
        env:
          RELEASE_TAG: 0.2.9
          RELEASE_COMMIT: 685c72e1c4838ae1744db9388591f5b9fadd3a75
          PROMOTE_COMMIT: 15c17e7e97dea0b6b7eb00102e92885567d3da90
          STAGING_REF: refs/ci-governance/release/35032973591-1
          STAGED_TAG_REF: refs/ci-governance/release-tag/35032973591-1
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "::error title=Invalid ref::Run this recovery only from main."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main \
            || ! git merge-base --is-ancestor "$PROMOTE_COMMIT" origin/main; then
            echo "::error title=Release history missing::main must retain the verified release and next-development commits."
            exit 1
          fi

          if [[ "$(git show "$PROMOTE_COMMIT:code/pom.xml" | sed -n 's|^[[:space:]]*<version>\([^<]*\)</version>[[:space:]]*$|\1|p' | head -1)" != "0.2.10-SNAPSHOT" ]]; then
            echo "::error title=Unexpected next version::The verified promotion commit is not the 0.2.10-SNAPSHOT baseline."
            exit 1
          fi

          staging_branch="$(git ls-remote origin "$STAGING_REF" | cut -f1)"
          staged_tag_object="$(git ls-remote origin "$STAGED_TAG_REF" | cut -f1)"
          staged_tag_target="$(git ls-remote origin "${STAGED_TAG_REF}^{}" | cut -f1)"
          if [[ -n "$staging_branch$staged_tag_object$staged_tag_target" ]]; then
            if [[ "$staging_branch" != "$PROMOTE_COMMIT" || -z "$staged_tag_object" || "$staged_tag_target" != "$RELEASE_COMMIT" ]]; then
              echo "::error title=Invalid staging refs::Staging refs do not match the signed release provenance."
              exit 1
            fi
            git fetch --no-tags origin "${STAGED_TAG_REF}:${STAGED_TAG_REF}"
          elif [[ -n "$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}^{}" | cut -f1)" ]]; then
            echo "Staging refs were already cleaned after a prior recovery attempt."
          else
            echo "::error title=Missing staging refs::Neither verified staging refs nor a published recovery tag are available."
            exit 1
          fi

      - name: Restore the official immutable tag
        shell: bash
        env:
          RELEASE_TAG: 0.2.9
          RELEASE_COMMIT: 685c72e1c4838ae1744db9388591f5b9fadd3a75
          STAGED_TAG_REF: refs/ci-governance/release-tag/35032973591-1
        run: |
          set -euo pipefail

          existing_target="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}^{}" | cut -f1)"
          if [[ -z "$existing_target" ]]; then
            git push origin "${STAGED_TAG_REF}:refs/tags/${RELEASE_TAG}"
            existing_target="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}^{}" | cut -f1)"
          fi
          if [[ "$existing_target" != "$RELEASE_COMMIT" ]]; then
            echo "::error title=Conflicting release tag::The public tag does not resolve to the published release commit."
            exit 1
          fi

      - name: Download retained release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: java-distributions-0.2.9
          path: dist
          run-id: 35032973591
          github-token: ${{ github.token }}

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: 0.2.9
          RELEASE_COMMIT: 685c72e1c4838ae1744db9388591f5b9fadd3a75
        run: |
          set -euo pipefail
          assets=(
            dist/jacoco-report-aggregate-0.2.9.jar
            dist/mavencentral-ci-testing-core-0.2.9.jar
          )
          for asset in "${assets[@]}"; do
            if [[ ! -f "$asset" ]]; then
              echo "::error title=Missing distribution::Expected release asset $asset is absent."
              exit 1
            fi
          done

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            target="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.target_commitish')"
            if [[ "$target" != "$RELEASE_COMMIT" ]]; then
              echo "::error title=Conflicting GitHub Release::The existing release targets an unexpected commit."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_COMMIT" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Delete verified staging refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: 0.2.9
          RELEASE_COMMIT: 685c72e1c4838ae1744db9388591f5b9fadd3a75
          STAGING_REF: refs/ci-governance/release/35032973591-1
          STAGED_TAG_REF: refs/ci-governance/release-tag/35032973591-1
        run: |
          set -euo pipefail

          tag_target="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}^{}" | cut -f1)"
          release_target="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.target_commitish')"
          if [[ "$tag_target" != "$RELEASE_COMMIT" || "$release_target" != "$RELEASE_COMMIT" ]]; then
            echo "::error title=Incomplete recovery::The public tag and GitHub Release must both resolve to the verified release commit."
            exit 1
          fi

          staging_branch="$(git ls-remote origin "$STAGING_REF" | cut -f1)"
          staged_tag="$(git ls-remote origin "$STAGED_TAG_REF" | cut -f1)"
          if [[ -n "$staging_branch$staged_tag" ]]; then
            git push --atomic origin --delete "$STAGING_REF" "$STAGED_TAG_REF"
          fi
