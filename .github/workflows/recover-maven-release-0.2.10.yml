name: Recover Maven release 0.2.10 finalizer

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  finalize:
    name: Finalize verified 0.2.10 publication
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Create recovery GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Verify immutable recovery inputs
        id: verify-recovery
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: 0.2.10
          RELEASE_COMMIT: 92dc2078ae4007f79c27172cae86256e58354bd5
          PROMOTE_COMMIT: 1996b1170fa2ae973a787145244b04d0ed16d192
          STAGING_REF: refs/ci-governance/release/35096266784-1
          STAGED_TAG_REF: refs/ci-governance/release-tag/35096266784-1
          STAGED_TAG_OBJECT: 1389fa0e6e23d2d42b83416ee5d3cc77c135c4c0
          BUNDLE_SHA256: 3026f0f6d4326fd107d000bcc36408c8499efd8112f2f04c802cd4434b3c2153
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "::error title=Invalid ref::Run this recovery only from main."
            exit 1
          fi

          staging_branch="$(git ls-remote origin "$STAGING_REF" | cut -f1)"
          staged_tag_object="$(git ls-remote origin "$STAGED_TAG_REF" | cut -f1)"
          staged_tag_target="$(git ls-remote origin "${STAGED_TAG_REF}^{}" | cut -f1)"
          public_tag="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}^{}" | cut -f1)"
          public_release=""
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            public_release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.target_commitish')"
          fi
          if [[ -z "$staging_branch$staged_tag_object$staged_tag_target" ]]; then
            if [[ "$public_tag" == "$RELEASE_COMMIT" && "$public_release" == "$RELEASE_COMMIT" ]]; then
              echo "::notice title=Recovery already finalized::The verified public tag and GitHub Release exist and staging refs were cleaned."
              echo "already_finalized=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error title=Missing staging refs::Recovery is incomplete and its verified staging refs are unavailable."
            exit 1
          fi
          echo "already_finalized=false" >> "$GITHUB_OUTPUT"
          if [[ "$staging_branch" != "$PROMOTE_COMMIT" \
            || "$staged_tag_object" != "$STAGED_TAG_OBJECT" \
            || "$staged_tag_target" != "$RELEASE_COMMIT" ]]; then
            echo "::error title=Invalid staging refs::Staging refs do not match the failed release provenance."
            exit 1
          fi
          git fetch --no-tags origin \
            "$STAGING_REF:$STAGING_REF" \
            "$STAGED_TAG_REF:$STAGED_TAG_REF"

          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" HEAD \
            || ! git merge-base --is-ancestor "$PROMOTE_COMMIT" HEAD; then
            echo "::error title=Release history missing::main must retain the verified release and next-development commits."
            exit 1
          fi
          if [[ "$(git show "$RELEASE_COMMIT:code/pom.xml" | sed -n 's|^[[:space:]]*<version>\([^<]*\)</version>[[:space:]]*$|\1|p' | head -1)" != "$RELEASE_TAG" ]]; then
            echo "::error title=Unexpected release version::The staged release commit does not contain the published version."
            exit 1
          fi
          if [[ "$(sed -n 's|^[[:space:]]*<version>\([^<]*\)</version>[[:space:]]*$|\1|p' code/pom.xml | head -1)" != "0.2.11-SNAPSHOT" ]]; then
            echo "::error title=Unexpected next version::main is not at the verified next-development baseline."
            exit 1
          fi
          if [[ "$(grep -c 'InditexTech/gh-actions/maven-central@1cc068f5c8abd2a1aa4cbfc45b42cbaa8aff35cd' .github/workflows/code-maven_java-release.yml)" != "2" ]]; then
            echo "::error title=Stale Maven Central renderer::main must retain both v1.1.3 Maven Central steps."
            exit 1
          fi

      - name: Download and verify retained release evidence
        if: steps.verify-recovery.outputs.already_finalized != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: java-release-source-35096266784-1
          path: source
          run-id: 35096266784
          github-token: ${{ github.token }}

      - name: Validate retained source bundle
        if: steps.verify-recovery.outputs.already_finalized != 'true'
        shell: bash
        env:
          RELEASE_COMMIT: 92dc2078ae4007f79c27172cae86256e58354bd5
          BUNDLE_SHA256: 3026f0f6d4326fd107d000bcc36408c8499efd8112f2f04c802cd4434b3c2153
        run: |
          set -euo pipefail

          bundle="source/release.bundle"
          metadata="source/release-metadata.json"
          if [[ ! -f "$bundle" || ! -f "$metadata" ]]; then
            echo "::error title=Missing release evidence::The retained source bundle is incomplete."
            exit 1
          fi
          if ! jq -e \
            --arg run_id "35096266784" \
            --arg run_attempt "1" \
            --arg source_commit "$RELEASE_COMMIT" \
            --arg bundle_sha256 "$BUNDLE_SHA256" \
            --arg artifact_name "java-release-source-35096266784-1" \
            'type == "object" and .run_id == $run_id and .run_attempt == $run_attempt and .source_commit == $source_commit and .bundle_sha256 == $bundle_sha256 and .bundle_format == "git-bundle-v2" and .artifact_name == $artifact_name' \
            "$metadata" > /dev/null; then
            echo "::error title=Invalid release evidence::Retained metadata does not match the failed run."
            exit 1
          fi
          if [[ "$(sha256sum "$bundle" | awk '{print $1}')" != "$BUNDLE_SHA256" ]]; then
            echo "::error title=Release source digest mismatch::The retained bundle differs from the prepared source."
            exit 1
          fi
          verifier="$RUNNER_TEMP/release-source-verifier"
          git clone --quiet --no-checkout "$bundle" "$verifier"
          git -C "$verifier" cat-file -e "$RELEASE_COMMIT^{commit}"

      - name: Download and verify retained distributions
        if: steps.verify-recovery.outputs.already_finalized != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: java-distributions-0.2.10
          path: dist
          run-id: 35096266784
          github-token: ${{ github.token }}

      - name: Verify published coordinates and release assets
        if: steps.verify-recovery.outputs.already_finalized != 'true'
        shell: bash
        run: |
          set -euo pipefail

          declare -A assets=(
            [jacoco-report-aggregate-0.2.10.jar]=4cc7a93600f2560bc53166b33025b7d628fcfcb236f62d03acecbd6be480b408
            [mavencentral-ci-testing-core-0.2.10.jar]=33475c035b5bb03e527942ac132e2291b16f3ea2ada4e5e01c536f610918f2bc
          )
          for asset in "${!assets[@]}"; do
            if [[ ! -f "dist/$asset" || "$(sha256sum "dist/$asset" | awk '{print $1}')" != "${assets[$asset]}" ]]; then
              echo "::error title=Invalid distribution::The retained $asset does not match the verified release artifact."
              exit 1
            fi
          done
          for artifact in mavencentral-ci-testing mavencentral-ci-testing-core jacoco-report-aggregate; do
            pom="$RUNNER_TEMP/${artifact}-0.2.10.pom"
            curl --fail --silent --show-error \
              "https://repo1.maven.org/maven2/dev/inditex/${artifact}/0.2.10/${artifact}-0.2.10.pom" \
              > "$pom"
            python3 -c '
          import sys
          import xml.etree.ElementTree as etree

          root = etree.parse(sys.argv[1]).getroot()
          namespace = {"m": "http://maven.apache.org/POM/4.0.0"}
          artifact_id = root.findtext("m:artifactId", namespaces=namespace)
          group_id = root.findtext("m:groupId", namespaces=namespace) or root.findtext("m:parent/m:groupId", namespaces=namespace)
          version = root.findtext("m:version", namespaces=namespace) or root.findtext("m:parent/m:version", namespaces=namespace)
          if (group_id, artifact_id, version) != ("dev.inditex", sys.argv[2], "0.2.10"):
              raise SystemExit(f"Unexpected published GAV: {group_id}:{artifact_id}:{version}")
          ' "$pom" "$artifact"
          done

      - name: Restore official tag and GitHub Release
        if: steps.verify-recovery.outputs.already_finalized != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: 0.2.10
          RELEASE_COMMIT: 92dc2078ae4007f79c27172cae86256e58354bd5
          STAGED_TAG_OBJECT: 1389fa0e6e23d2d42b83416ee5d3cc77c135c4c0
        run: |
          set -euo pipefail

          existing_target="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}^{}" | cut -f1)"
          if [[ -z "$existing_target" ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/${RELEASE_TAG}" \
              -f "sha=$STAGED_TAG_OBJECT" > /dev/null
            existing_target="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}^{}" | cut -f1)"
          fi
          if [[ "$existing_target" != "$RELEASE_COMMIT" ]]; then
            echo "::error title=Conflicting release tag::The public tag does not resolve to the published release commit."
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            target="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.target_commitish')"
            if [[ "$target" != "$RELEASE_COMMIT" ]]; then
              echo "::error title=Conflicting GitHub Release::The existing release targets an unexpected commit."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_COMMIT" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
          gh release upload "$RELEASE_TAG" \
            dist/jacoco-report-aggregate-0.2.10.jar \
            dist/mavencentral-ci-testing-core-0.2.10.jar \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Delete verified staging refs
        if: steps.verify-recovery.outputs.already_finalized != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: 0.2.10
          RELEASE_COMMIT: 92dc2078ae4007f79c27172cae86256e58354bd5
          STAGING_REF: refs/ci-governance/release/35096266784-1
          STAGED_TAG_REF: refs/ci-governance/release-tag/35096266784-1
        run: |
          set -euo pipefail

          tag_target="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}^{}" | cut -f1)"
          release_target="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.target_commitish')"
          if [[ "$tag_target" != "$RELEASE_COMMIT" || "$release_target" != "$RELEASE_COMMIT" ]]; then
            echo "::error title=Incomplete recovery::The public tag and GitHub Release must both resolve to the verified release commit."
            exit 1
          fi
          if git config --local --get-all http.https://github.com/.extraheader > /dev/null; then
            git config --local --unset-all http.https://github.com/.extraheader
          fi
          gh auth setup-git
          git push --atomic origin --delete "$STAGING_REF" "$STAGED_TAG_REF"
